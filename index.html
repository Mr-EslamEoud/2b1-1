                CONFIG.questionStarters.forEach(starter => {
                    const regex = new RegExp(`^${starter}`, 'g');
                    formattedContent = formattedContent.replace(regex, `<span class="text-questionHead font-black text-xl ml-1">${starter}</span>`);
                });
            } else if (type === 'explanation') {
                formattedContent = formattedContent.replace(/\n/g, '<br/>');
                formattedContent = formattedContent.replace(/(?:\s+|^|<br\/>)(\((\d+|[١-٩]+)\)|(\d+|[١-٩]+)\(|(\d+|[١-٩]+)\)|\((\d+|[١-٩]+)\-|\b(\d+)[-.)])\s*/g, '<br/><span class="inline-flex items-center justify-center min-w-7 h-7 px-2.5 rounded-lg bg-blue-100 text-primary font-black text-sm ml-2 my-1 border border-blue-200 shadow-xs align-middle">$1</span> ');
                formattedContent = formattedContent.replace(/(📌\s*المفهوم(?: المحوري| والمصطلح المحوري)?:\s*)/g, '<br/><span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-lg bg-purple-100 text-purple-700 font-black text-sm my-1 border border-purple-200 shadow-xs">$1</span> ');
                
                if (CONFIG.keywordsGroups) {
                    const allEntries = [];
                    CONFIG.keywordsGroups.forEach(group => {
                        group.words.forEach(w => {
                            if (w && w.trim()) {
                                allEntries.push({ word: w.trim(), colorClass: group.colorClass });
                            }
                        });
                    });
                    allEntries.sort((a, b) => b.word.length - a.word.length);
                    allEntries.forEach(({ word, colorClass }) => {
                        const escaped = word.split('').map(c => '.*+?^$()[]{}|\\'.indexOf(c) !== -1 ? '\\' + c : c).join('');
                        const regex = new RegExp(`(${escaped})`, 'g');
                        formattedContent = formattedContent.split(/(<[^>]+>)/g).map(segment => {
                            if (segment.startsWith('<') && segment.endsWith('>')) return segment;
                            return segment.replace(regex, `<span class="${colorClass} font-black px-0.5">$1</span>`);
                        }).join('');
                    });
                }
            }

            return <span dangerouslySetInnerHTML={{ __html: formattedContent }} />;

                canvas.width = window.innerWidth;

                context.lineCap = "round";
                context.lineJoin = "round";
                context.lineWidth = 4;
                context.strokeStyle = color;
                contextRef.current = context;

                const handleResize = () => {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

                    canvas.height = window.innerHeight;
                    
                    const ctx = canvas.getContext("2d");
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = color;
                    contextRef.current = ctx;

                return () => window.removeEventListener('resize', handleResize);
            }, [isEnabled]);

            useEffect(() => {
                if (contextRef.current) {
                    contextRef.current.strokeStyle = color;
                }
            }, [color]);

            const startDrawing = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                contextRef.current.beginPath();
                contextRef.current.moveTo(clientX, clientY);
                setIsDrawing(true);
                setPoints([{ x: clientX, y: clientY }]);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                if (e.cancelable) e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                contextRef.current.lineTo(clientX, clientY);
                contextRef.current.stroke();
                if (points.length < 150) {
                     setPoints(prev => [...prev, { x: clientX, y: clientY }]);
                }
            };

                const canvas = canvasRef.current;
                const context = canvas.getContext("2d");
                context.clearRect(0, 0, canvas.width, canvas.height);
                setPoints([]);
            };

            const detectCheckmarkGesture = () => {
                if (points.length < 15) return false;
                let lowestPointIndex = 0;
                for (let i = 1; i < points.length; i++) {
                    if (points[i].y > points[lowestPointIndex].y) lowestPointIndex = i;
                }
                if (lowestPointIndex < 3 || lowestPointIndex > points.length - 3) return false;

                const startPoint = points[0];
                const lowestPoint = points[lowestPointIndex];
                const endPoint = points[points.length - 1];

                const dropY = lowestPoint.y - startPoint.y;
                const riseY = lowestPoint.y - endPoint.y;
                if (dropY > 20 && riseY > 35 && riseY > dropY * 0.7) {
                    return true;
                }
                return false;
            };

                contextRef.current.closePath();
                setIsDrawing(false);
                if (detectCheckmarkGesture()) {
                    clearCanvas();
                }

                                </p>
                                <p className="text-xs text-gray-600 font-bold leading-relaxed">
                                    هذا الملف قالب تفاعلي مستقل جاهز لاستيعاب بنك الأسئلة الجديد فور توفره.
                                </p>
                            </div>
                        ) : hasProgress ? (
                            <Fragment>
                                <button onClick={() => onStart(true)} className="w-full bg-primary hover:bg-blue-800 text-white font-bold py-4 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 text-xl flex justify-center items-center gap-3">
                                    <span>استكمال المراجعة</span>
                                    <i className="fa-solid fa-play"></i>
                                </button>
                                <button onClick={() => onStart(false)} className="w-full bg-transparent border-2 border-gray-400 text-gray-600 hover:border-red-500 hover:text-red-500 font-bold py-3 px-8 rounded-xl transition-colors text-lg">
                                    البدء من جديد
                                </button>
                            </Fragment>
                        ) : (
                            <button onClick={() => onStart(false)} className="w-full bg-primary hover:bg-blue-800 text-white font-bold py-4 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 text-xl flex justify-center items-center gap-3 border-b-4 border-blue-900">
                                <span>ابدأ المراجعة</span>
                                <i className="fa-solid fa-arrow-left"></i>
                            </button>
                        )}
                    </div>

                    <div className="mt-12 text-center">
                        <p className="text-black text-sm mb-1 font-bold opacity-80">رؤية وإعداد</p>
                        <p className="text-primary font-black text-xl">{CONFIG.teacherName}</p>
                    </div>
                </div>
            );
        };

        const QuizScreen = ({ onHome, isDarkMode, toggleDarkMode }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedAnswers, setSelectedAnswers] = useState({});
            const [isCanvasEnabled, setIsCanvasEnabled] = useState(false);
            const [slideDir, setSlideDir] = useState('');
            const [showMap, setShowMap] = useState(false);
            const [confetti, setConfetti] = useState([]);
            const [showFeedbackBanner, setShowFeedbackBanner] = useState(false);
            const [feedbackType, setFeedbackType] = useState(null);

            // Lifelines state
            const [eliminatedOptions, setEliminatedOptions] = useState({});
            const [activeHints, setActiveHints] = useState({});

            const question = QUESTIONS_DATA[currentIndex];

            const handleFiftyFifty = () => {
                if (!question || question.type !== 'mcq' || question.options.length <= 2) return;
                if (eliminatedOptions[currentIndex]) return;

                const incorrectIndices = question.options
                    .map((_, i) => i)
                    .filter(i => i !== question.correctIndex);

                const shuffled = [...incorrectIndices].sort(() => 0.5 - Math.random());
                const toEliminate = shuffled.slice(0, 2);

                setEliminatedOptions({
                    ...eliminatedOptions,
                    [currentIndex]: toEliminate
                });
            };

            const handleToggleHint = () => {
                setActiveHints({
                    ...activeHints,
                    [currentIndex]: !activeHints[currentIndex]
                });
            };

            const getQuestionHint = () => {
                if (!question || !question.explanation) return 'فكّر في المفهوم الجوهري المرتبط بالسؤال والصلة المباشرة به.';
                const conceptMatch = question.explanation.match(/📌s*المفهومs*:s*([^\n<]+)/);
                if (conceptMatch && conceptMatch[1]) {
                    return `مفتاح الحل يرتبط بمفهوم: «${conceptMatch[1].trim()}»`;
                }
                const plain = question.explanation.replace(/<[^>]+>/g, '').replace(/1\(/g, '').trim();
                const firstSentence = plain.split(/[\n.]/)[0];
                if (firstSentence && firstSentence.length > 10) {
                    return firstSentence.length > 90 ? firstSentence.substring(0, 90) + '...' : firstSentence;
                }
                return 'ركّز على الكلمات المفتاحية في رأس السؤال لتحديد الإجابة الأدق.';
            };

            useEffect(() => {
                setConfetti([]);
                setShowFeedbackBanner(false);
                setFeedbackType(null);
            }, [currentIndex]);

            const spawnConfetti = () => {
                const arr = [];
                const colors = ['#3B82F6', '#EF4444', '#10B981', '#F59E0B', '#EC4899'];
                for (let i = 0; i < 40; i++) {
                    arr.push({
                        id: i,
                        left: `${Math.random() * 100}%`,
                        size: `${Math.random() * 10 + 6}px`,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        delay: `${Math.random() * 0.8}s`,
                        duration: `${Math.random() * 2 + 1.5}s`
                    });
                }
                setConfetti(arr);
            };

            const hasAnsweredCurrent = selectedAnswers[currentIndex] !== undefined;
            const currentAnswer = selectedAnswers[currentIndex];

            const handleAnswer = (index) => {
                if (hasAnsweredCurrent) return;
                const isCorrect = index === question.correctIndex;
                if (question.type !== 'essay') {
                    if (isCorrect) {
                        spawnConfetti();
                        setFeedbackType('correct');
                    } else {
                        setFeedbackType('incorrect');
                    }
                    setShowFeedbackBanner(true);
                    setTimeout(() => setShowFeedbackBanner(false), 2200);
                }
                setSelectedAnswers({ ...selectedAnswers, [currentIndex]: index });
            };

            const handleNext = () => {
                if (currentIndex < QUESTIONS_DATA.length - 1) {
                    setSlideDir('animate-slide-in-right');
                    setCurrentIndex(currentIndex + 1);
                    setTimeout(() => setSlideDir(''), 300);
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) {
                    setSlideDir('animate-slide-in-left');
                    setCurrentIndex(currentIndex - 1);
                    setTimeout(() => setSlideDir(''), 300);
                }
            };

            // Keyboard navigation (ArrowLeft: التالي, ArrowRight: السابق)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (showMap || isCanvasEnabled) return;
                    if (e.key === 'ArrowLeft') handleNext();
                    else if (e.key === 'ArrowRight') handlePrev();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentIndex, showMap, isCanvasEnabled]);

            // Touch swipe gesture (Right: السابق, Left: التالي)
            const touchStartX = useRef(null);
            const touchStartY = useRef(null);

            const handleTouchStart = (e) => {
                if (isCanvasEnabled || showMap) return;
                touchStartX.current = e.touches[0].clientX;
                touchStartY.current = e.touches[0].clientY;
            };

            const handleTouchEnd = (e) => {
                if (isCanvasEnabled || showMap || touchStartX.current === null || touchStartY.current === null) return;
                const deltaX = e.changedTouches[0].clientX - touchStartX.current;
                const deltaY = e.changedTouches[0].clientY - touchStartY.current;

                if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
                    if (deltaX > 0) {
                        // التحريك يمين -> السابق
                        handlePrev();
                    } else {
                        // التحريك يسار -> التالي
                        handleNext();
                    }
                }
                touchStartX.current = null;
                touchStartY.current = null;
            };

            const toggleFullScreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            };

            const optionLetters = ['أ', 'ب', 'ج', 'د'];

            if (!question) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-gray-50 p-6 text-center">
                        <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-gray-100">
                            <i className="fa-solid fa-clipboard-check text-4xl text-primary mb-3 block"></i>
                            <h2 className="text-xl font-black text-gray-800 mb-2">تم تفريغ بنك الأسئلة بنجاح</h2>
                            <p className="text-sm text-gray-600 mb-6 font-bold leading-relaxed">
                                المنصة جاهزة لاستقبال الأسئلة الجديدة لدرس:
                                <br />
                                <span className="text-secondary font-black" dangerouslySetInnerHTML={{ __html: CONFIG.lessonName }}></span>
                            </p>
                            <button onClick={onHome} className="bg-primary hover:bg-blue-800 text-white font-bold py-3 px-6 rounded-xl transition-all cursor-pointer">
                                العودة للرئيسية
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-[100dvh] min-h-[100dvh] flex flex-col bg-slate-50 overflow-hidden">
                    <header className="bg-white shadow-md px-4 py-3 flex justify-between items-center z-40 relative flex-wrap gap-4">
                        <div className="flex items-center gap-3 shrink-0">
                            <i className="fa-solid fa-graduation-cap text-primary text-2xl"></i>
                            <div className="flex items-center gap-2 flex-wrap text-sm sm:text-base">
                                <span className="font-black text-secondary">موسوعة الكنز التعليمي</span>
                                <span className="hidden sm:inline w-px h-5 bg-gray-300"></span>
                                <span className="text-black font-black hidden sm:inline">رؤية إعداد <span className="text-secondary font-black">{CONFIG.teacherName}</span></span>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 shrink-0">
                            <button onClick={() => setShowMap(true)} className="bg-gray-100 hover:bg-gray-200 rounded-lg px-3 py-1.5 flex items-center gap-2 font-bold shadow-sm border border-gray-200">
                                <i className="fa-solid fa-list-ol text-gray-500 text-sm hidden sm:inline"></i>
                                <span className="text-secondary text-lg">{currentIndex + 1}</span>
                                <span className="text-gray-400">/</span>
                                <span className="text-gray-500">{QUESTIONS_DATA.length}</span>
                            </button>
                            <button onClick={() => setIsCanvasEnabled(!isCanvasEnabled)} className={`w-10 h-10 rounded-full flex items-center justify-center ${isCanvasEnabled ? 'bg-primary text-white' : 'bg-gray-50 text-gray-600'}`}>
                                <i className="fa-solid fa-pen"></i>
                            </button>
                            <button onClick={toggleFullScreen} className="w-10 h-10 rounded-full bg-gray-50 text-gray-600 flex items-center justify-center">
                                <i className="fa-solid fa-expand"></i>
                            </button>
                            <button onClick={toggleDarkMode} className="w-10 h-10 rounded-full bg-gray-50 text-gray-600 flex items-center justify-center">
                                <i className={`fa-solid ${isDarkMode ? 'fa-sun' : 'fa-moon'}`}></i>
                            </button>
                            <button onClick={onHome} className="w-10 h-10 rounded-full bg-red-50 text-red-600 flex items-center justify-center">
                                <i className="fa-solid fa-house"></i>
                            </button>
                        </div>
                    </header>

                    <DrawingCanvas isEnabled={isCanvasEnabled} onClose={() => setIsCanvasEnabled(false)} />

                    {/* Confetti */}
                    <div className="pointer-events-none fixed inset-0 z-[70] overflow-hidden">
                        {confetti.map((c) => (
                            <div key={c.id} className="absolute top-0 rounded-full animate-confetti-fall" style={{ left: c.left, width: c.size, height: c.size, backgroundColor: c.color, animationDelay: c.delay, animationDuration: c.duration }} />
                        ))}
                    </div>

                    {/* Feedback */}
                    {showFeedbackBanner && (
                        <div className="pointer-events-none fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className={`animate-pop-in p-6 rounded-3xl shadow-2xl flex flex-col items-center gap-3 max-w-sm w-full text-center border-4 ${feedbackType === 'correct' ? 'bg-green-100 border-green-500 text-green-800' : 'bg-red-100 border-red-500 text-red-800'}`}>
                                {feedbackType === 'correct' ? (
                                    <Fragment>
                                        <div className="w-16 h-16 rounded-full bg-green-500 text-white flex items-center justify-center text-3xl animate-bounce">
                                            <i className="fa-solid fa-check"></i>
                                        </div>
                                        <h4 className="text-2xl font-black">إجابة صحيحة</h4>
                                        <p className="text-lg font-bold">أحسنت يا بطل! تميز وإبداع 🌟</p>
                                    </Fragment>
                                ) : (
                                    <Fragment>
                                        <div className="w-16 h-16 rounded-full bg-red-500 text-white flex items-center justify-center text-4xl animate-bounce">😢</div>
                                        <h4 className="text-2xl font-black">إجابة خاطئة</h4>
                                        <p className="text-base font-bold">تابع التحليل والشرح النموذجي</p>
                                    </Fragment>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Question Map */}
                    {showMap && (
                        <div className="fixed inset-0 z-[60] bg-black/60 flex justify-center items-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-3xl max-h-[85vh] overflow-y-auto content-scroll animate-scale-up">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-2xl font-black text-primary">خريطة الأسئلة ({QUESTIONS_DATA.length})</h3>
                                    <button onClick={() => setShowMap(false)} className="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex justify-center items-center">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div className="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-10 gap-2.5">
                                    {QUESTIONS_DATA.map((_, idx) => {
                                        const isAnswered = selectedAnswers[idx] !== undefined;
                                        const isCorrect = isAnswered && (selectedAnswers[idx] === QUESTIONS_DATA[idx].correctIndex);
                                        const isCurrent = idx === currentIndex;
                                        let btnClass = "h-11 rounded-xl font-bold text-base border-2 transition-all ";
                                        if (isCurrent) btnClass += "border-secondary bg-secondary text-white shadow-lg scale-105";
                                        else if (isAnswered) btnClass += isCorrect ? "border-green-500 bg-green-50 text-green-700" : "border-red-500 bg-red-50 text-red-700";
                                        else btnClass += "border-gray-200 bg-white text-gray-700 hover:border-primary";

                                        return (
                                            <button key={idx} onClick={() => { setCurrentIndex(idx); setShowMap(false); }} className={btnClass}>
                                                {idx + 1}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main content */}
                    <main 
                        className="flex-1 relative overflow-hidden bg-white watermark-bg"
                        onTouchStart={handleTouchStart}
                        onTouchEnd={handleTouchEnd}
                    >
                        <div 
                            className="absolute inset-0 overflow-y-auto content-scroll p-4 sm:p-8 pb-36 sm:pb-16 flex flex-col touch-pan-y"
                            style={{ WebkitOverflowScrolling: 'touch', overscrollBehaviorY: 'contain' }}
                        >
                            <div className={`w-full max-w-4xl mx-auto flex-1 flex flex-col ${slideDir || 'animate-fade-in'}`}>
                                <div className="bg-[#ebf0ff] border-r-8 border-primary rounded-2xl p-6 mb-4 shadow-sm relative">
                                    <h2 className="text-2xl sm:text-3xl font-black text-gray-900 leading-relaxed font-['Tajawal']">
                                        <FormattedText text={question.text} type="question" />
                                    </h2>
                                    <div className="absolute -top-3.5 right-6 bg-secondary text-white px-4 py-0.5 rounded-full text-sm font-bold shadow-md">
                                        السؤال {currentIndex + 1}
                                    </div>
                                </div>

                                {/* Lifelines Bar */}
                                <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
                                    <div className="flex items-center gap-2">
                                        {question.type === 'mcq' && question.options.length > 2 && (
                                            <button
                                                onClick={handleFiftyFifty}
                                                disabled={hasAnsweredCurrent || !!eliminatedOptions[currentIndex]}
                                                className={`flex items-center gap-2 px-4 py-2 rounded-2xl text-sm font-black transition-all cursor-pointer shadow-xs border ${
                                                    eliminatedOptions[currentIndex]
                                                        ? 'bg-amber-100 text-amber-800 border-amber-300 opacity-80 cursor-default'
                                                        : hasAnsweredCurrent
                                                        ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed opacity-50'
                                                        : 'bg-white hover:bg-amber-50 text-amber-700 border-amber-300 hover:scale-102 hover:shadow-md'
                                                }`}
                                                title="حذف خيارين غير صحيحين"
                                            >
                                                <i className="fa-solid fa-wand-magic-sparkles text-amber-500"></i>
                                                <span>حذف إجابتين (50:50)</span>
                                                {eliminatedOptions[currentIndex] && (
                                                    <span className="text-xs bg-amber-500 text-white rounded-full px-1.5 py-0.5">مفعّل ✓</span>
                                                )}
                                            </button>
                                        )}

                                        <button
                                            onClick={handleToggleHint}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-2xl text-sm font-black transition-all cursor-pointer shadow-xs border ${
                                                activeHints[currentIndex]
                                                    ? 'bg-indigo-600 text-white border-indigo-700 shadow-md scale-102'
                                                    : 'bg-white hover:bg-indigo-50 text-indigo-700 border-indigo-300 hover:scale-102 hover:shadow-md'
                                            }`}
                                            title="عرض تلميح ذكي"
                                        >
                                            <i className={`fa-solid fa-lightbulb ${activeHints[currentIndex] ? 'text-yellow-300 animate-pulse' : 'text-indigo-500'}`}></i>
                                            <span>{activeHints[currentIndex] ? 'إخفاء التلميح' : 'تلميح ذكي'}</span>
                                        </button>
                                    </div>

                                    <div className="text-xs font-bold text-gray-500 flex items-center gap-1.5">
                                        <i className="fa-solid fa-circle-info text-primary"></i>
                                        <span>وسائل مساعدة تفاعلية</span>
                                    </div>
                                </div>

                                {/* Smart Hint Display Card */}
                                {activeHints[currentIndex] && (
                                    <div className="mb-5 bg-gradient-to-r from-indigo-50 via-blue-50 to-indigo-50 border-2 border-indigo-300 rounded-2xl p-5 relative animate-expand-down shadow-xs">
                                        <div className="flex items-start gap-3">
                                            <div className="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5">
                                                <i className="fa-solid fa-lightbulb text-yellow-300 text-lg"></i>
                                            </div>
                                            <div className="flex-1">
                                                <h5 className="text-sm font-black text-indigo-900 mb-1">
                                                    💡 إضاءة وتلميح ذكي للسؤال:
                                                </h5>
                                                <p className="text-lg font-bold text-gray-800 leading-relaxed">
                                                    {getQuestionHint()}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="flex flex-col gap-3.5 mb-6">
                                    {question.options.map((opt, idx) => {
                                        const isEliminated = (eliminatedOptions[currentIndex] || []).includes(idx);
                                        let optStyle = "border-primary/20 hover:border-primary/60 bg-white cursor-pointer";
                                        let iconStyle = "bg-primary text-white";

                                        if (isEliminated) {
                                            optStyle = "border-gray-200 bg-gray-100/70 opacity-30 cursor-not-allowed line-through grayscale pointer-events-none select-none";
                                            iconStyle = "bg-gray-200 text-gray-400";
                                        } else if (hasAnsweredCurrent) {
                                            if (idx === question.correctIndex) {
                                                optStyle = "border-green-500 bg-green-50 shadow-md ring-2 ring-green-300";
                                                iconStyle = "bg-green-500 text-white";
                                            } else if (idx === currentAnswer) {
                                                optStyle = "border-red-500 bg-red-50 opacity-80";
                                                iconStyle = "bg-red-500 text-white";
                                            } else {
                                                optStyle = "border-gray-200 bg-gray-50 opacity-50 cursor-not-allowed";
                                                iconStyle = "bg-gray-300 text-gray-500";
                                            }
                                        }

                                        return (
                                            <div key={idx} onClick={() => handleAnswer(idx)} className={`relative flex items-center p-4 rounded-2xl border-2 transition-all ${optStyle}`}>
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shrink-0 ml-4 transition-colors ${iconStyle}`}>
                                                    {question.type === 'essay' ? '💡' : optionLetters[idx]}
                                                </div>
                                                <span className="text-xl font-bold text-black flex-1">{opt}</span>
                                                {hasAnsweredCurrent && idx === question.correctIndex && (
                                                    <i className="fa-solid fa-check text-green-500 text-2xl absolute left-4"></i>
                                                )}
                                                {hasAnsweredCurrent && idx === currentAnswer && currentAnswer !== question.correctIndex && (
                                                    <i className="fa-solid fa-xmark text-red-500 text-2xl absolute left-4"></i>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>

                                {hasAnsweredCurrent && question.explanation && (
                                    <div className="mt-2 mb-6 bg-pink-50 border-2 border-secondary/40 rounded-2xl p-6 relative overflow-hidden animate-expand-down">
                                        <div className="absolute top-0 right-0 bg-secondary text-white px-4 py-1 rounded-bl-xl font-bold text-sm">
                                            التعليل والتحليل النموذجي
                                        </div>
                                        <div className="text-xl text-black leading-relaxed mt-4 font-bold">
                                            <FormattedText text={question.explanation} type="explanation" />
                                        </div>
                                    </div>
                                )}

                                <div className="flex-1"></div>

                                <div className="flex justify-between items-center mt-8 pt-5 pb-10 border-t border-gray-200 gap-3">
                                    <button onClick={handlePrev} disabled={currentIndex === 0} className={`flex items-center justify-center gap-2 px-5 sm:px-7 py-3.5 sm:py-3 rounded-2xl border-2 font-bold text-base sm:text-lg min-w-[110px] sm:min-w-[130px] transition-all cursor-pointer ${currentIndex === 0 ? 'border-gray-200 text-gray-400 cursor-not-allowed opacity-50' : 'border-secondary text-secondary hover:bg-secondary hover:text-white shadow-sm active:scale-95'}`}>
                                        <i className="fa-solid fa-arrow-right"></i>
                                        <span>السابق</span>
                                    </button>

                                    <button onClick={handleNext} disabled={currentIndex === QUESTIONS_DATA.length - 1} className={`flex items-center justify-center gap-2 px-6 sm:px-8 py-3.5 sm:py-3 rounded-2xl font-bold text-base sm:text-lg min-w-[120px] sm:min-w-[140px] shadow-md border-b-4 transition-all cursor-pointer ${currentIndex === QUESTIONS_DATA.length - 1 ? 'bg-gray-300 text-gray-500 border-gray-400 cursor-not-allowed shadow-none' : 'bg-primary text-white border-blue-900 hover:bg-blue-800 active:scale-95 hover:shadow-lg'}`}>
                                        <span>التالي</span>
                                        <i className="fa-solid fa-arrow-left"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [hasProgress, setHasProgress] = useState(false);

            useEffect(() => {
                if (isDarkMode) document.body.classList.add('dark-mode');
                else document.body.classList.remove('dark-mode');
            }, [isDarkMode]);

            return (
                <div>
                    {currentView === 'home' && (
                        <HomeScreen 
                            onStart={() => setCurrentView('quiz')} 
                            hasProgress={hasProgress} 
                            questionsCount={QUESTIONS_DATA.length}
                            isDarkMode={isDarkMode} 
                            toggleDarkMode={() => setIsDarkMode(!isDarkMode)} 
                        />
                    )}
                    {currentView === 'quiz' && (
                        <QuizScreen 
                            onHome={() => setCurrentView('home')} 
                            isDarkMode={isDarkMode} 
                            toggleDarkMode={() => setIsDarkMode(!isDarkMode)} 
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
